[project]
name = "heinzel-contract-model"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Canonical contract models, digests and artifact references."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pillarmesh-provider-sdk"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "cryptography>=45,<47",
  "pillarmesh-contract-model",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
pillarmesh-contract-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/pillarmesh_provider_sdk"]
only_mutate = [
  "src/pillarmesh_provider_sdk/acquisition_encoding.py",
  "src/pillarmesh_provider_sdk/acquisition_protocols.py",
  "src/pillarmesh_provider_sdk/errors.py",
  "src/pillarmesh_provider_sdk/source_conformance.py",
]
also_copy = ["tests"]
pytest_add_cli_args_test_selection = [
  "tests/test_acquisition_encoding.py",
  "tests/test_source_conformance.py",
]

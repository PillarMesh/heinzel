[project]
name = "heinzel-provider-sdk"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Provider SDK: acquisition, destination and product SQL protocols."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "cryptography>=45,<47",
  "heinzel-contract-model",
  "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[tool.uv.sources]
heinzel-contract-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/heinzel_provider_sdk"]
only_mutate = [
  "src/heinzel_provider_sdk/acquisition_encoding.py",
  "src/heinzel_provider_sdk/acquisition_protocols.py",
  "src/heinzel_provider_sdk/errors.py",
  "src/heinzel_provider_sdk/source_conformance.py",
]
also_copy = ["tests"]
pytest_add_cli_args_test_selection = [
  "tests/test_acquisition_encoding.py",
  "tests/test_source_conformance.py",
]

[project]
name = "heinzel-execution-graph"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Execution graph and product physical plan models."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = ["cryptography>=50.0.2,<51", "heinzel-contract-model"]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[tool.uv.sources]
heinzel-contract-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

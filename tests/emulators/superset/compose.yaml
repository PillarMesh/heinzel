x-superset-environment: &superset-environment
  HEINZEL_SUPERSET_ADMIN_PASSWORD: ${HEINZEL_SUPERSET_ADMIN_PASSWORD:?required}
  HEINZEL_SUPERSET_SECRET_KEY: ${HEINZEL_SUPERSET_SECRET_KEY:?required}
  HEINZEL_SUPERSET_WAREHOUSE_PASSWORD: ${HEINZEL_SUPERSET_WAREHOUSE_PASSWORD:?required}
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py

# The image and the configuration are the quickstart's own, not a copy of them. These live
# requirements exercise the artifact the demonstration ships, so a change that breaks publishing
# fails here rather than only on a reader's first `--profile dashboards up`.
x-superset-service: &superset-service
  build:
    context: ../../../deploy/quickstart/superset
    dockerfile: Dockerfile
  environment: *superset-environment
  volumes:
    - superset_home:/app/superset_home
    - ../../../deploy/quickstart/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ${HEINZEL_SUPERSET_PRIVATE_DIRECTORY:?required}:/heinzel-private:ro
  networks:
    - governed_local

services:
  warehouse:
    image: postgres:18.6-bookworm@sha256:33c86c9cfb790e257e470b29e8c97bd1bd6fee0a70ab2d7a2e377ab639c09935
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: heinzel_warehouse
      POSTGRES_PASSWORD: ${HEINZEL_SUPERSET_WAREHOUSE_PASSWORD:?required}
      POSTGRES_USER: postgres
      HEINZEL_SUPERSET_WAREHOUSE_PASSWORD: ${HEINZEL_SUPERSET_WAREHOUSE_PASSWORD:?required}
    volumes:
      - warehouse_data:/var/lib/postgresql
      - ./init-warehouse.sh:/docker-entrypoint-initdb.d/10-governed-dashboard.sh:ro
    networks:
      - governed_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname heinzel_warehouse --username postgres"]
      interval: 2s
      timeout: 3s
      retries: 60

  superset-init:
    <<: *superset-service
    command:
      - /bin/sh
      - -ceu
      - >-
        superset db upgrade &&
        superset fab create-admin
        --username admin
        --firstname Heinzel
        --lastname Administrator
        --email admin@localhost.invalid
        --password "$$HEINZEL_SUPERSET_ADMIN_PASSWORD" &&
        superset init
    depends_on:
      warehouse:
        condition: service_healthy

  superset:
    <<: *superset-service
    restart: unless-stopped
    mem_limit: 1536m
    command:
      - /bin/sh
      - -ceu
      - >-
        exec gunicorn
        --bind 0.0.0.0:8088
        --certfile /heinzel-private/server.crt
        --keyfile /heinzel-private/server.key
        --workers 2
        --timeout 120
        "superset.app:create_app()"
    ports:
      - 127.0.0.1:${HEINZEL_SUPERSET_HOST_PORT:?required}:8088
    networks:
      - governed_local
      - host_loopback
    depends_on:
      warehouse:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--cacert",
          "/heinzel-private/ca.crt",
          "https://127.0.0.1:8088/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  superset_home:
    name: ${HEINZEL_SUPERSET_PROJECT_NAME:?required}-home
  warehouse_data:
    name: ${HEINZEL_SUPERSET_PROJECT_NAME:?required}-warehouse

networks:
  governed_local:
    name: ${HEINZEL_SUPERSET_PROJECT_NAME:?required}-network
    internal: true
  host_loopback:
    name: ${HEINZEL_SUPERSET_PROJECT_NAME:?required}-loopback

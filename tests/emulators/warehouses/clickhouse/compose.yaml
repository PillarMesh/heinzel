x-clickhouse-service: &clickhouse-service
  image: clickhouse/clickhouse-server:26.9.8.3@sha256:230b973a00b5bac5b8925bd2898fae95a039aa6f25063fa8c507ffe9e2c7d770
  entrypoint:
    - /bin/bash
    - -ceu
    - |
      install -d -m 0700 -o clickhouse -g clickhouse /var/lib/clickhouse/heinzel-tls
      install -m 0600 -o clickhouse -g clickhouse /heinzel-private/server.key /var/lib/clickhouse/heinzel-tls/server.key
      install -m 0644 -o clickhouse -g clickhouse /heinzel-private/server.crt /var/lib/clickhouse/heinzel-tls/server.crt
      install -m 0644 -o clickhouse -g clickhouse /heinzel-private/ca.crt /var/lib/clickhouse/heinzel-tls/ca.crt
      install -d -m 0700 -o clickhouse -g clickhouse /var/lib/clickhouse/backups
      install -m 0644 -o clickhouse -g clickhouse /heinzel-private/${HEINZEL_CLICKHOUSE_USERS_FILE:?required} /etc/clickhouse-server/users.d/heinzel-bootstrap.xml
      if [ -s /heinzel-private/clickhouse-restore.zip ]; then
        install -m 0600 -o clickhouse -g clickhouse /heinzel-private/clickhouse-restore.zip /var/lib/clickhouse/backups/restore.zip
      fi
      chown clickhouse:clickhouse /var/lib/clickhouse
      exec runuser --user clickhouse -- clickhouse-server --config-file=/etc/clickhouse-server/config.xml
  healthcheck:
    disable: true
  volumes:
    - ./config.xml:/etc/clickhouse-server/config.d/heinzel.xml:ro
    - ${HEINZEL_CLICKHOUSE_PRIVATE_DIRECTORY:?required}:/heinzel-private:ro

services:
  clickhouse:
    <<: *clickhouse-service
    container_name: ${HEINZEL_CLICKHOUSE_CONTAINER_NAME:?required}
    ports:
      - "127.0.0.1:${HEINZEL_CLICKHOUSE_HOST_PORT:?required}:8443"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config.xml:/etc/clickhouse-server/config.d/heinzel.xml:ro
      - ${HEINZEL_CLICKHOUSE_PRIVATE_DIRECTORY:?required}:/heinzel-private:ro
    networks:
      - clickhouse_internal
      - host_loopback

  clickhouse_restore:
    <<: *clickhouse-service
    profiles: ["restore"]
    container_name: ${HEINZEL_CLICKHOUSE_RESTORE_CONTAINER_NAME:-clickhouse-restore-inactive}
    volumes:
      - clickhouse_restore_data:/var/lib/clickhouse
      - ./config.xml:/etc/clickhouse-server/config.d/heinzel.xml:ro
      - ${HEINZEL_CLICKHOUSE_PRIVATE_DIRECTORY:?required}:/heinzel-private:ro
    networks:
      - clickhouse_restore_internal
      - restore_host_loopback

  clickhouse_isolation_probe:
    image: clickhouse/clickhouse-server:26.9.8.3@sha256:230b973a00b5bac5b8925bd2898fae95a039aa6f25063fa8c507ffe9e2c7d770
    profiles: ["restore"]
    container_name: ${HEINZEL_CLICKHOUSE_RESTORE_ISOLATION_PROBE_CONTAINER_NAME:-clickhouse-restore-isolation-probe-inactive}
    entrypoint:
      - /bin/bash
      - -ceu
      - sleep infinity
    networks:
      - isolation_probe_network

volumes:
  clickhouse_data:
    name: ${HEINZEL_CLICKHOUSE_DATA_VOLUME_NAME:?required}
  clickhouse_restore_data:
    name: ${HEINZEL_CLICKHOUSE_RESTORE_DATA_VOLUME_NAME:-clickhouse-restore-data-inactive}

networks:
  clickhouse_internal:
    name: ${HEINZEL_CLICKHOUSE_PRIVATE_NETWORK_NAME:?required}
    internal: true
  host_loopback:
    name: ${HEINZEL_CLICKHOUSE_LOOPBACK_NETWORK_NAME:?required}
  clickhouse_restore_internal:
    name: ${HEINZEL_CLICKHOUSE_RESTORE_PRIVATE_NETWORK_NAME:-clickhouse-restore-private-inactive}
    internal: true
  restore_host_loopback:
    name: ${HEINZEL_CLICKHOUSE_RESTORE_LOOPBACK_NETWORK_NAME:-clickhouse-restore-loopback-inactive}
    internal: true
  isolation_probe_network:
    name: ${HEINZEL_CLICKHOUSE_ISOLATION_PROBE_NETWORK_NAME:-clickhouse-isolation-probe-network-inactive}
    external: true

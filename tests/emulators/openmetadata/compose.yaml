services:
  mysql:
    image: docker.getcollate.io/openmetadata/db@sha256:8a77669a2e64769dbb3ba4684fd527cc4a68e54879b199a6a8f1e74fa14da557
    platform: linux/amd64
    command: --sort_buffer_size=10M
    environment:
      MYSQL_ROOT_PASSWORD: ${PILLARMESH_OPENMETADATA_MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute "use openmetadata_db"
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:4f6bdcb742e892539c6ac49b0dd3e4e182e90218546e8c6a22db378c344acb60
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1024m -Xmx1024m
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -fsS http://localhost:9200/_cluster/health
      interval: 15s
      timeout: 10s
      retries: 10

  rotate-database-credentials:
    image: docker.getcollate.io/openmetadata/db@sha256:8a77669a2e64769dbb3ba4684fd527cc4a68e54879b199a6a8f1e74fa14da557
    platform: linux/amd64
    environment:
      MYSQL_PWD: ${PILLARMESH_OPENMETADATA_MYSQL_ROOT_PASSWORD:?required}
      OPENMETADATA_DATABASE_PASSWORD: ${PILLARMESH_OPENMETADATA_DATABASE_PASSWORD:?required}
      AIRFLOW_DATABASE_PASSWORD: ${PILLARMESH_OPENMETADATA_AIRFLOW_DATABASE_PASSWORD:?required}
    volumes:
      - mysql-data:/var/lib/mysql
    command: >-
      sh -ec 'printf "%s\\n"
      "ALTER USER '\''openmetadata_user'\''@'\''%'\'' IDENTIFIED BY '\''$$OPENMETADATA_DATABASE_PASSWORD'\'';"
      "ALTER USER '\''airflow_user'\''@'\''%'\'' IDENTIFIED BY '\''$$AIRFLOW_DATABASE_PASSWORD'\'';"
      | mysql --socket=/var/lib/mysql/mysql.sock --user=root'
    depends_on:
      mysql:
        condition: service_healthy

  execute-migrate-all:
    image: docker.getcollate.io/openmetadata/server@sha256:6c878281973d9e2c366e9da4f256a744acf67b1e53195fab67c3191e504e4169
    platform: linux/amd64
    command: ./bootstrap/openmetadata-ops.sh migrate
    environment: &openmetadata-environment
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_HOST: mysql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_PORT: "3306"
      DB_SCHEME: mysql
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${PILLARMESH_OPENMETADATA_DATABASE_PASSWORD:?required}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      OM_DATABASE: openmetadata_db
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      SEARCH_TYPE: elasticsearch
    depends_on:
      mysql:
        condition: service_healthy
      rotate-database-credentials:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server@sha256:6c878281973d9e2c366e9da4f256a744acf67b1e53195fab67c3191e504e4169
    platform: linux/amd64
    environment: *openmetadata-environment
    ports:
      - 127.0.0.1:8585:8585
      - 127.0.0.1:8586:8586
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10

  ingestion:
    image: docker.getcollate.io/openmetadata/ingestion@sha256:fe5effad9dbce98852b2f588905a4a8926c3c03de97fcceac8fe8e3ec927d717
    platform: linux/amd64
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      DB_HOST: mysql
      DB_PORT: "3306"
      AIRFLOW_DB: airflow_db
      DB_SCHEME: mysql+mysqldb
      DB_USER: airflow_user
      DB_PASSWORD: ${PILLARMESH_OPENMETADATA_AIRFLOW_DATABASE_PASSWORD:?required}
    entrypoint: /bin/bash
    command: ["/opt/airflow/ingestion_dependency.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      rotate-database-credentials:
        condition: service_completed_successfully
      openmetadata-server:
        condition: service_started

volumes:
  elasticsearch-data:
  mysql-data:

# Test directories cannot join the `packages` list in `pyproject.toml`: they carry
# no `__init__.py` and eleven module basenames repeat across components. They are
# checked one directory at a time instead, which keeps each run small.
#
# `explicit_package_bases` names each file from the repository root, the same way
# `--import-mode=importlib` names it at run time, so `tests.acceptance.foo` means one
# module to pytest and to mypy alike. Without it mypy named a directory's files by
# bare basename while the tests imported them by dotted path, which cost twice:
# a file imported from inside its own directory was "found twice under different
# module names", an error that blocked eight directories from being measured at all;
# and a cross-module import that mypy could not resolve was silenced with
# `# type: ignore[import-not-found]`, which typed every symbol behind it as `Any`.
# One such suppression in `services/contract/tests` let a three-parameter helper take
# five arguments with the directory reported clean.
[mypy]
python_version = 3.13
strict = True
explicit_package_bases = True

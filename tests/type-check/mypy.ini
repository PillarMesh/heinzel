# Test directories cannot join the `packages` list in `pyproject.toml`: they carry
# no `__init__.py` and eleven module basenames repeat across components. They are
# checked one directory at a time instead, which keeps each run small.
#
# `explicit_package_bases` adds the repository root to the candidate base directories,
# so the dotted paths the tests import each other by -- `tests.acceptance.foo`,
# `services.runtime.tests.bar` -- resolve to the same modules `--import-mode=importlib`
# builds at run time. It does not make every file dotted: a hyphenated component
# directory is not a module name, so `services/catalog-control/tests/test_service.py`
# is still the module `test_service`. That is why each directory is checked on its own,
# which keeps such a name local to its run.
#
# Without the flag mypy named a directory's files by bare basename while the tests
# imported them by dotted path, which cost twice: a file imported from inside its own
# directory was "found twice under different module names", an error that blocked eight
# directories from being measured at all; and a cross-module import mypy could not
# resolve was silenced with `# type: ignore[import-not-found]`, which types every symbol
# behind it as `Any`. One such suppression in `services/contract/tests` let a
# three-parameter helper take five arguments with the directory reported clean.
#
# The flag resolves names against the working directory, so `check.sh` runs from the
# repository root to make this gate's result independent of where it is invoked.
[mypy]
python_version = 3.13
strict = True
explicit_package_bases = True

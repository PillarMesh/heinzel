# Test directories cannot join the `packages` list in `pyproject.toml`: they carry
# no `__init__.py`, eleven module basenames repeat across components, and the
# workspace directories are hyphenated, so neither module resolution nor
# `--explicit-package-bases` can name them uniquely. They are checked one
# directory at a time instead, which keeps every module name local to its run.
[mypy]
python_version = 3.13
strict = True

[project]
name = "pillarmesh-console"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  # Governed-local projections call the owning services' public read interfaces.
  # The console never opens another component's database.
  "pillarmesh-catalog-control",
  "pillarmesh-contract-model",
  "pillarmesh-contract-service",
  "pillarmesh-evidence",
  "pillarmesh-request-management",
  "pillarmesh-semantic-registry",
  "pillarmesh-warehouse-control",
  "pydantic>=2.11,<3",
  "starlette>=1.6,<2",
  "uvicorn>=0.52,<1",
]

[tool.uv.sources]
pillarmesh-catalog-control = { workspace = true }
pillarmesh-contract-model = { workspace = true }
pillarmesh-contract-service = { workspace = true }
pillarmesh-evidence = { workspace = true }
pillarmesh-request-management = { workspace = true }
pillarmesh-semantic-registry = { workspace = true }
pillarmesh-warehouse-control = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

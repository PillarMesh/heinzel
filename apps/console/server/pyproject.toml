[project]
name = "heinzel-console"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Governed web console server for Heinzel."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = [
  # Governed-local projections call the owning services' public read interfaces.
  # The console never opens another component's database.
  "heinzel-access-control",
  "heinzel-bi-control",
  "heinzel-catalog-control",
  "heinzel-compiler",
  "heinzel-connection-broker",
  "heinzel-contract-model",
  "heinzel-contract-service",
  "heinzel-dbt-adapter",
  "heinzel-evidence",
  "heinzel-execution-graph",
  "heinzel-iir",
  "heinzel-knowledge-graph",
  "heinzel-provider-openmetadata",
  "heinzel-provider-postgresql",
  "heinzel-provider-sdk",
  "heinzel-provider-superset",
  "heinzel-request-management",
  "heinzel-runtime",
  "heinzel-semantic-registry",
  "heinzel-state",
  "heinzel-warehouse-control",
  # The local entitlement authority signs envelopes and serves them over loopback TLS
  # (`answers/policy_authority.py`): `cryptography` for the keys and the certificate, `httpx`
  # for the client the shipped signed-HTTP reader resolves through.
  "cryptography>=50.0.1,<51",
  "httpx>=0.28,<1",
  # The demonstration provisions and reads its own warehouse (`demo/warehouse.py`).
  "psycopg[binary]>=3.3.6,<4",
  "pydantic>=2.13.5,<3",
  "starlette>=1.7.0,<2",
  "uvicorn>=0.52,<1",
]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[project.scripts]
heinzel-console = "heinzel_console.cli:main"

[tool.uv.sources]
heinzel-access-control = { workspace = true }
heinzel-bi-control = { workspace = true }
heinzel-catalog-control = { workspace = true }
heinzel-compiler = { workspace = true }
heinzel-connection-broker = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-contract-service = { workspace = true }
heinzel-dbt-adapter = { workspace = true }
heinzel-evidence = { workspace = true }
heinzel-execution-graph = { workspace = true }
heinzel-iir = { workspace = true }
heinzel-knowledge-graph = { workspace = true }
heinzel-provider-openmetadata = { workspace = true }
heinzel-provider-postgresql = { workspace = true }
heinzel-provider-sdk = { workspace = true }
heinzel-provider-superset = { workspace = true }
heinzel-request-management = { workspace = true }
heinzel-runtime = { workspace = true }
heinzel-semantic-registry = { workspace = true }
heinzel-state = { workspace = true }
heinzel-warehouse-control = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

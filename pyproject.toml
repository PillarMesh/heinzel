[project]
name = "pillarmesh-m0-workspace"
version = "0.1.0"
requires-python = "==3.13.*"

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "mutmut>=3.3,<4",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  # The workflow contract tests assert the CI gate's structure. Parsing the
  # workflow is the only way to check it; there is no stdlib YAML reader, and a
  # regex over the file would pass on a gate whose job graph had changed.
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = [
  "apps/console/server",
  "packages/contract-model",
  "packages/execution-graph",
  "packages/iir",
  "packages/provider-sdk",
  "providers/openmetadata",
  "providers/clickhouse",
  "providers/postgresql",
  "providers/snowflake",
  "providers/stripe",
  "providers/superset",
  "services/access-control",
  "services/authoring-mcp",
  "services/bi-control",
  "services/catalog-control",
  "services/connection-broker",
  "services/context-exposure",
  "services/compiler",
  "services/contract",
  "services/dbt-adapter",
  "services/evidence",
  "services/knowledge-graph",
  "services/request-management",
  "services/runtime",
  "services/semantic-registry",
  "services/state",
  "services/trigger",
  "services/warehouse-control",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["apps", "packages", "providers", "services", "tests"]
markers = [
  "emulator: requires an explicitly started local service emulator",
  "live: requires dedicated real service credentials or an explicitly started emulator",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = [
  "pillarmesh_console",
  "pillarmesh_contract_model",
  "pillarmesh_execution_graph",
  "pillarmesh_iir",
  "pillarmesh_provider_sdk",
  "pillarmesh_provider_openmetadata",
  "pillarmesh_provider_clickhouse",
  "pillarmesh_provider_postgresql",
  "pillarmesh_provider_snowflake",
  "pillarmesh_provider_stripe",
  "pillarmesh_provider_superset",
  "pillarmesh_access_control",
  "pillarmesh_authoring_mcp",
  "pillarmesh_bi_control",
  "pillarmesh_catalog_control",
  "pillarmesh_connection_broker",
  "pillarmesh_context_exposure",
  "pillarmesh_compiler",
  "pillarmesh_contract_service",
  "pillarmesh_dbt_adapter",
  "pillarmesh_evidence",
  "pillarmesh_knowledge_graph",
  "pillarmesh_request_management",
  "pillarmesh_runtime",
  "pillarmesh_semantic_registry",
  "pillarmesh_state",
  "pillarmesh_warehouse_control",
  "tests.acceptance.console_postgresql_engine",
  "tests.acceptance.plan2_orchestration",
  "tests.acceptance.plan3a_fault_matrix",
  "tests.acceptance.plan3a_orchestration",
  "tests.acceptance.run_console_governed",
  "tests.acceptance.run_m0",
  "tests.acceptance.run_plan2",
  "tests.acceptance.run_plan3a",
  "tests.acceptance.run_plan3b",
  "tests.acceptance.run_plan4a",
  "tests.ci.run_plan3a_witness",
  "tests.conformance.source_acquisition",
  "tests.conformance.warehouse_lifecycle",
]

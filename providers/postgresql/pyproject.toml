[project]
name = "pillarmesh-provider-postgresql"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pillarmesh-dbt-adapter",
  "pillarmesh-contract-model",
  "pillarmesh-provider-sdk",
  "pillarmesh-runtime",
  "pillarmesh-semantic-registry",
  "pillarmesh-warehouse-control",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
pillarmesh-dbt-adapter = { workspace = true }
pillarmesh-contract-model = { workspace = true }
pillarmesh-provider-sdk = { workspace = true }
pillarmesh-runtime = { workspace = true }
pillarmesh-semantic-registry = { workspace = true }
pillarmesh-warehouse-control = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heinzel-provider-postgresql"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "heinzel-dbt-adapter",
  "heinzel-contract-model",
  "heinzel-provider-sdk",
  "heinzel-runtime",
  "heinzel-semantic-registry",
  "heinzel-warehouse-control",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-dbt-adapter = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-provider-sdk = { workspace = true }
heinzel-runtime = { workspace = true }
heinzel-semantic-registry = { workspace = true }
heinzel-warehouse-control = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pillarmesh-provider-snowflake"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pillarmesh-contract-model",
  "pillarmesh-provider-sdk",
  "pydantic>=2.11,<3",
  "snowflake-connector-python>=3.17,<5",
]

[tool.uv.sources]
pillarmesh-contract-model = { workspace = true }
pillarmesh-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heinzel-provider-snowflake"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "heinzel-contract-model",
  "heinzel-provider-sdk",
  "pydantic>=2.11,<3",
  "snowflake-connector-python>=3.17,<5",
]

[tool.uv.sources]
heinzel-contract-model = { workspace = true }
heinzel-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pillarmesh-provider-openmetadata"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "pillarmesh-catalog-control",
  "pillarmesh-contract-model",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
pillarmesh-catalog-control = { workspace = true }
pillarmesh-contract-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heinzel-provider-openmetadata"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "heinzel-catalog-control",
  "heinzel-contract-model",
  "heinzel-provider-sdk",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-catalog-control = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

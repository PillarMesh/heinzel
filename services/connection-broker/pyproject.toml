[project]
name = "pillarmesh-connection-broker"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pillarmesh-contract-model",
  "pillarmesh-provider-sdk",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
pillarmesh-contract-model = { workspace = true }
pillarmesh-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/pillarmesh_connection_broker"]
only_mutate = [
  "src/pillarmesh_connection_broker/repository.py",
  "src/pillarmesh_connection_broker/service.py",
]
also_copy = ["tests"]
pytest_add_cli_args_test_selection = [
  "tests/test_repository.py",
  "tests/test_service.py",
]

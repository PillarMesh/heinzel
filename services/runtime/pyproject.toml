[project]
name = "heinzel-runtime"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "heinzel-connection-broker",
  "heinzel-catalog-control",
  "heinzel-contract-model",
  "heinzel-contract-service",
  "heinzel-evidence",
  "heinzel-execution-graph",
  "heinzel-provider-sdk",
  "heinzel-semantic-registry",
  "heinzel-state",
  "heinzel-trigger",
  "heinzel-warehouse-control",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-catalog-control = { workspace = true }
heinzel-connection-broker = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-contract-service = { workspace = true }
heinzel-evidence = { workspace = true }
heinzel-execution-graph = { workspace = true }
heinzel-provider-sdk = { workspace = true }
heinzel-semantic-registry = { workspace = true }
heinzel-state = { workspace = true }
heinzel-trigger = { workspace = true }
heinzel-warehouse-control = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/heinzel_runtime"]
only_mutate = [
  "src/heinzel_runtime/acquisition.py",
  "src/heinzel_runtime/acquisition_errors.py",
]
also_copy = ["tests"]
pytest_add_cli_args = ["--import-mode=prepend"]
pytest_add_cli_args_test_selection = [
  "tests/test_acquisition.py",
  "tests/test_acquisition_acknowledgement.py",
]

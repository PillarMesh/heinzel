[project]
name = "heinzel-semantic-registry"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "heinzel-catalog-control",
  "heinzel-contract-model",
  "heinzel-contract-service",
  "heinzel-provider-openmetadata",
  "heinzel-provider-sdk",
  "heinzel-request-management",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-contract-model = { workspace = true }
heinzel-contract-service = { workspace = true }
heinzel-catalog-control = { workspace = true }
heinzel-provider-openmetadata = { workspace = true }
heinzel-provider-sdk = { workspace = true }
heinzel-request-management = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

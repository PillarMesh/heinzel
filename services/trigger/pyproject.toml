[project]
name = "pillarmesh-trigger"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pillarmesh-contract-model",
  "pillarmesh-state",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
pillarmesh-contract-model = { workspace = true }
pillarmesh-state = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pillarmesh-authoring-mcp"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "mcp>=2,<3",
  "pillarmesh-contract-model",
  "pillarmesh-contract-service",
  "pillarmesh-evidence",
  "pillarmesh-execution-graph",
  "pillarmesh-provider-postgresql",
  "pillarmesh-provider-snowflake",
  "pillarmesh-runtime",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
pillarmesh-m0 = "pillarmesh_authoring_mcp.cli:main"
pillarmesh-mcp = "pillarmesh_authoring_mcp.mcp_server:main"

[tool.uv.sources]
pillarmesh-contract-model = { workspace = true }
pillarmesh-contract-service = { workspace = true }
pillarmesh-evidence = { workspace = true }
pillarmesh-execution-graph = { workspace = true }
pillarmesh-provider-postgresql = { workspace = true }
pillarmesh-provider-snowflake = { workspace = true }
pillarmesh-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

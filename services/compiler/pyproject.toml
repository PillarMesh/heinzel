[project]
name = "heinzel-compiler"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Compiles product intent into legal, signed plans."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = [
  "cryptography>=50.0.1,<51",
  "heinzel-contract-model",
  "heinzel-execution-graph",
  "heinzel-iir",
  "heinzel-provider-sdk",
  "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[tool.uv.sources]
heinzel-contract-model = { workspace = true }
heinzel-execution-graph = { workspace = true }
heinzel-iir = { workspace = true }
heinzel-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/heinzel_compiler"]
only_mutate = [
  "src/heinzel_compiler/generation_sql.py",
  "src/heinzel_compiler/numeric_bounds.py",
  "src/heinzel_compiler/product_compiler.py",
  "src/heinzel_compiler/restricted_sql.py",
]
also_copy = ["tests", "legality"]
pytest_add_cli_args_test_selection = ["tests"]

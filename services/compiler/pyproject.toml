[project]
name = "pillarmesh-compiler"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pillarmesh-contract-model",
  "pillarmesh-execution-graph",
  "pillarmesh-iir",
  "pillarmesh-provider-sdk",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
pillarmesh-contract-model = { workspace = true }
pillarmesh-execution-graph = { workspace = true }
pillarmesh-iir = { workspace = true }
pillarmesh-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/pillarmesh_compiler"]
only_mutate = ["src/pillarmesh_compiler/legality.py"]
also_copy = ["tests", "legality/fixtures"]
pytest_add_cli_args_test_selection = ["tests"]

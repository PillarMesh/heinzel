[project]
name = "heinzel-access-control"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Access proposals, grants, expiry and revocation."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = [
  "cryptography>=50.0.1,<51",
  "httpx>=0.28,<1",
  "heinzel-contract-model",
  "heinzel-provider-sdk",
  "heinzel-request-management",
  "pydantic>=2.13.5,<3",
]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[tool.uv.sources]
heinzel-contract-model = { workspace = true }
heinzel-provider-sdk = { workspace = true }
heinzel-request-management = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/heinzel_access_control"]
only_mutate = ["src/heinzel_access_control/application_service.py"]
also_copy = ["tests"]
pytest_add_cli_args_test_selection = ["tests/test_application_service.py"]

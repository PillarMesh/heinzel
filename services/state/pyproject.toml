[project]
name = "heinzel-state"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "heinzel-contract-model",
  "heinzel-provider-sdk",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-contract-model = { workspace = true }
heinzel-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["src/heinzel_state"]
only_mutate = [
  "src/heinzel_state/artifacts.py",
  "src/heinzel_state/crypto.py",
  "src/heinzel_state/recovery_service.py",
  "src/heinzel_state/repository.py",
]
also_copy = ["tests"]
pytest_add_cli_args_test_selection = [
  "tests/test_artifacts.py",
  "tests/test_crypto.py",
  "tests/test_recovery_service.py",
  "tests/test_repository.py",
]

[project]
name = "heinzel-context-exposure"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "mcp>=2,<3",
  "heinzel-access-control",
  "heinzel-contract-model",
  "heinzel-request-management",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
heinzel-agent-mcp = "heinzel_context_exposure.mcp_server:main"

[tool.uv.sources]
heinzel-access-control = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-request-management = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

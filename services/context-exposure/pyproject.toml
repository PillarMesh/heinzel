[project]
name = "heinzel-context-exposure"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Governed agent interface over MCP."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = [
  "mcp>=2.2.0,<3",
  "heinzel-access-control",
  "heinzel-contract-model",
  "heinzel-request-management",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[project.scripts]
heinzel-agent-mcp = "heinzel_context_exposure.mcp_server:main"

[tool.uv.sources]
heinzel-access-control = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-request-management = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

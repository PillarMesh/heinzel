[project]
name = "heinzel-evidence"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "heinzel-compiler",
  "heinzel-contract-model",
  "heinzel-execution-graph",
  "heinzel-iir",
  "heinzel-provider-sdk",
  "heinzel-request-management",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-compiler = { workspace = true }
heinzel-contract-model = { workspace = true }
heinzel-execution-graph = { workspace = true }
heinzel-iir = { workspace = true }
heinzel-provider-sdk = { workspace = true }
heinzel-request-management = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

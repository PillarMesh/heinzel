[project]
name = "heinzel-dbt-adapter"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "cryptography>=45,<47",
  "dbt-clickhouse==1.10.2",
  "dbt-core==1.10.13",
  "dbt-postgres==1.10.2",
  "heinzel-contract-model",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
heinzel-contract-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heinzel-warehouse-control"
version = "0.1.0"
requires-python = "==3.13.*"
description = "Managed warehouse bindings and lifecycle."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PillarMesh", email = "karthik@pillarmesh.com" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = [
  # Fernet provides authenticated encryption for bounded operation-secret bundles.
  "cryptography>=50.0.1,<51",
  "heinzel-contract-model",
  "pydantic>=2.13.5,<3",
]

[project.urls]
Repository = "https://github.com/PillarMesh/heinzel"
Issues = "https://github.com/PillarMesh/heinzel/issues"

[tool.uv.sources]
heinzel-contract-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

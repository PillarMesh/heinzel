name: Warehouse lifecycle

# The gate job is always present so it can be a required check. A workflow-level
# `paths` filter would leave the required check pending forever on a pull request
# that does not match it.
on:
  pull_request:
  # Pushes to a pull request branch already run through `pull_request`. Without
  # this filter every such push started a second, identical two-engine Docker
  # lifecycle, and creating any branch forced one as well, because a push with
  # no known previous commit cannot prove the change is unrelated.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an outdated pull request run, but let a main-branch run finish so
  # its evidence is not discarded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The pull request head commit, not the ephemeral merge commit: the
          # witnessed evidence records the checked-out commit, and a merge-ref
          # SHA is unreachable from any branch and gone on the next push.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Detect warehouse lifecycle changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = workflow_dispatch; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test "$EVENT_NAME" = pull_request; then
            if ! git fetch --no-tags origin "$BASE_REF"; then
              echo 'affected=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="origin/$BASE_REF...HEAD"
          elif test -n "$BEFORE" && test "$BEFORE" != 0000000000000000000000000000000000000000 \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE...HEAD"
          else
            # An unknown range cannot prove the change is unrelated.
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$RUNNER_TEMP/plan3a-changed-paths"
          if ! git diff --no-renames --name-only -z "$range" > "$changed_paths"; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          affected=false
          while true; do
            changed_path=''
            if IFS= read -r -d '' changed_path; then
              case "$changed_path" in
                ''|*$'\n'*|*$'\r'*) affected=true ;;
                services/warehouse-control/*|providers/postgresql/*|providers/clickhouse/*) affected=true ;;
                packages/provider-sdk/*|packages/contract-model/*) affected=true ;;
                pyproject.toml|uv.lock|.python-version) affected=true ;;
                docs/plan3a/*) affected=true ;;
                docs/architecture/specifications/managed-data-engineering-platform-addendum-v0.1.md) affected=true ;;
                docs/superpowers/specs/2026-08-24-plan-3a-managed-warehouse-lifecycle-design.md) affected=true ;;
                docs/superpowers/plans/2026-08-24-plan-3a-managed-warehouse-lifecycle.md) affected=true ;;
                tests/emulators/warehouses/*|tests/acceptance/*|tests/conformance/*) affected=true ;;
                tests/fault-injection/*|tests/end-to-end/*) affected=true ;;
                tests/integration/test_postgresql_warehouse_live.py) affected=true ;;
                tests/integration/test_clickhouse_warehouse_live.py) affected=true ;;
                tests/ci/run_plan3a_witness.py) affected=true ;;
                tests/ci/test_warehouse_lifecycle_workflow.py) affected=true ;;
                .github/workflows/warehouse-lifecycle.yml) affected=true ;;
              esac
            elif test -n "$changed_path"; then
              # A non-NUL-terminated record is not trustworthy path evidence.
              affected=true
              break
            else
              break
            fi
          done < "$changed_paths"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"

  lifecycle:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.13.5
          enable-cache: true
      - name: Sync locked workspace
        run: uv sync --locked --all-packages
      - name: Prepare the private witness environment
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/plan3a"
          mkdir -m 0700 "$root"
          {
            echo "PILLARMESH_PLAN3A_STATE_PATH=$root/state"
            echo "PILLARMESH_PLAN3A_SECRET_DIRECTORY=$root/secrets"
            echo "PILLARMESH_PLAN3A_BACKUP_DIRECTORY=$root/backups"
            echo "PILLARMESH_PLAN3A_EVIDENCE_DIRECTORY=$root/evidence"
            echo "PILLARMESH_PLAN3A_RESERVATION_PATH=$root/reservation.json"
            echo "PILLARMESH_PLAN3A_SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "PILLARMESH_PLAN3A_RETENTION_DEADLINE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_ENV"
          echo "PILLARMESH_PLAN3A_POSTGRES_IMAGE=postgres:18.6-bookworm@sha256:33c86c9cfb790e257e470b29e8c97bd1bd6fee0a70ab2d7a2e377ab639c09935" >> "$GITHUB_ENV"
          echo "PILLARMESH_PLAN3A_CLICKHOUSE_IMAGE=clickhouse/clickhouse-server:25.8.32.4@sha256:7c39abeb161d627fa3ca6a1e5f6241ecdc24501e8463486e61b80be3ab4471b0" >> "$GITHUB_ENV"
          state_encryption_key="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          evidence_signing_key="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          credential_canaries="$(uv run python -c 'import json,secrets; print(json.dumps([secrets.token_urlsafe(24) for _ in range(8)]))')"
          credential_masks="$(PILLARMESH_CREDENTIAL_CANARIES="$credential_canaries" uv run python -c 'import json,os; print(*json.loads(os.environ["PILLARMESH_CREDENTIAL_CANARIES"]), sep="\n")')"
          printf '::add-mask::%s\n' "$state_encryption_key" "$evidence_signing_key"
          while IFS= read -r credential_canary; do
            test -n "$credential_canary"
            printf '::add-mask::%s\n' "$credential_canary"
          done <<< "$credential_masks"
          {
            echo "PILLARMESH_PLAN3A_STATE_ENCRYPTION_KEY=$state_encryption_key"
            echo "PILLARMESH_PLAN3A_EVIDENCE_SIGNING_KEY=$evidence_signing_key"
            echo "PILLARMESH_PLAN3A_CREDENTIAL_CANARIES=$credential_canaries"
          } >> "$GITHUB_ENV"
      - name: Run witnessed Plan 3A acceptance
        id: witness
        run: |
          uv run python -m tests.ci.run_plan3a_witness \
            --output "$RUNNER_TEMP/plan3a-cost.json" \
            --timeout-seconds 600 \
            --sample-interval-seconds 1 \
            -- \
            uv run python -m tests.acceptance.run_plan3a run \
              --authorize-retention-cleanup
      - name: Validate sanitized Plan 3A evidence
        run: uv run python -m tests.acceptance.run_plan3a validate-evidence
      - name: Upload sanitized Plan 3A evidence
        # Always: a failed validate-evidence step is exactly when the evidence
        # is needed, and skipping the upload discards it with the runner.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warehouse-lifecycle-evidence
          path: ${{ env.PILLARMESH_PLAN3A_EVIDENCE_DIRECTORY }}/plan3a-evidence.json
          # Warn, not error: an earlier failure can leave no evidence at all, and
          # that must not replace the real failure with a missing-artifact error.
          if-no-files-found: warn
      - name: Upload the sanitized cost artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warehouse-lifecycle-cost
          path: ${{ runner.temp }}/plan3a-cost.json
          if-no-files-found: error
      - name: Exact teardown
        if: always()
        run: |
          set -euo pipefail
          ledger="$PILLARMESH_PLAN3A_STATE_PATH/private-ledger.json.encrypted"
          if test -e "$PILLARMESH_PLAN3A_RESERVATION_PATH" \
            || test -L "$PILLARMESH_PLAN3A_RESERVATION_PATH" \
            || test -e "$ledger" \
            || test -L "$ledger"; then
            uv run python -m tests.acceptance.run_plan3a teardown \
              --authorize-retention-cleanup
          fi

  gate:
    needs: [changes, lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a decided detector and a matching lifecycle result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AFFECTED: ${{ needs.changes.outputs.affected }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
        run: |
          set -euo pipefail
          # An undecided detector is a failed gate, never a passed one: an empty
          # AFFECTED would otherwise read as "unrelated change" and let a
          # warehouse change merge without any live run.
          test "$CHANGES_RESULT" = success || exit 1
          case "$AFFECTED" in
            true)  test "$LIFECYCLE_RESULT" = success ;;
            false) test "$LIFECYCLE_RESULT" = skipped ;;
            *)     exit 1 ;;
          esac

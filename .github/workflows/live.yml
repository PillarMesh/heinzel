name: Live journeys

# Nightly, on demand, and when a maintainer applies the `run-live` label to a pull request. The
# journeys start pinned engine images in Docker and read no repository secret.
#
# There is deliberately no `synchronize` trigger: a new push to a pull request, possibly from a
# fork, runs only after a maintainer has reviewed it and removed and re-applied `run-live`.
on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    # Adding some other label to a pull request starts nothing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-live'
    # Job-level, so a run skipped by the condition above never enters the group: at workflow
    # level, adding some other label would cancel the live run in progress. Re-applying the
    # label supersedes the outdated run; a scheduled or dispatched run is left to finish so its
    # evidence is not discarded.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # About 35 minutes of journeys when measured locally, plus image pulls.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request head commit, not the ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.13.5
          enable-cache: true
      - name: Sync locked workspace
        run: uv sync --locked --all-packages
      # Only journeys that need nothing but Docker and the locked workspace (dbt included).
      # Not listed, because the runner does not provide what they need: the Superset compose
      # build, Snowflake and LocalStack. Several of these files mark their tests `emulator`
      # rather than `live`, so the selection is `live or emulator`; `-m live` alone would
      # deselect them.
      #
      # A cluster started with the host's PostgreSQL binaries is no longer a reason to leave a
      # journey out: the step below finds `initdb` where this image keeps it, so the journeys
      # that call it are listed rather than excluded.
      #
      # OpenMetadata is now provided -- see the environment below -- because the compiled
      # product journey publishes its product through the catalog, and a journey that stops at
      # `publication_pending` does not show a consumable product. Its own dedicated journeys
      # (`test_openmetadata_live.py`, `test_openmetadata_publication_live.py`,
      # `test_openmetadata_product_catalog_live.py`) stay unlisted: the harness starts the stack
      # per test, so listing them would multiply cold starts of a three-container stack, and
      # their cost has not been measured here.
      #
      # `tests/quickstart` is deliberately absent: it builds the published image and has its
      # own workflow. The selection is an explicit file list rather than a directory, so
      # leaving it unlisted is the whole exclusion -- no `--ignore` is needed.
      - name: Run live journeys
        env:
          HEINZEL_RUN_PRODUCT_SQL_CONFORMANCE: "1"
          HEINZEL_RUN_ACCESS_EMULATORS: "1"
          HEINZEL_RUN_DESTINATION_EMULATORS: "1"
          # OpenMetadata's own bootstrap credential for `admin@open-metadata.org` under
          # `AUTHENTICATION_PROVIDER: basic`. It is the upstream default, not a secret of
          # ours: the emulator's compose file sets no admin password, so the server creates
          # that account itself and this is the value it uses. The provisioner authenticates
          # once with it and then rotates to generated per-operation passwords.
          HEINZEL_OPENMETADATA_BOOTSTRAP_ADMIN_PASSWORD: admin
          # Generous because this runner is slower than a developer machine: MySQL,
          # Elasticsearch, the schema migration and the server all have to report terminal
          # health. Overrunning it fails the journey rather than skipping it.
          HEINZEL_OPENMETADATA_READINESS_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          # Generated per run and never leaves this step: it encrypts the operation-secrets
          # directory of an emulator that is created and destroyed inside this job. A
          # repository secret would be wrong here -- a fork's pull request can run this
          # workflow and would receive none.
          #
          # Generated by Fernet rather than as an arbitrary token, because the secret store
          # passes it straight to `Fernet(...)`: a random string of the wrong length or
          # alphabet is not a key and fails at construction.
          HEINZEL_OPENMETADATA_SECRET_STORE_KEY="$(
            uv run python -c \
              'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
          )"
          export HEINZEL_OPENMETADATA_SECRET_STORE_KEY
          # Several of the journeys above start their own PostgreSQL cluster with `initdb`
          # rather than a container, and this image keeps the server binaries off PATH while
          # `psql` is on it. Without the directory they skip, and the step after this one fails
          # the run on any skip -- so a missing directory surfaces as a failure naming the
          # binary (`-rs` prints the reason) rather than as a quiet pass. Deliberately no count
          # or list here: either would have to be revised every time a journey is added, and a
          # comment that is wrong about which journeys need this is worse than one that is vague.
          if ! command -v initdb >/dev/null 2>&1; then
            postgresql_bin="$(
              ls -1d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1 || true
            )"
            if [ -n "$postgresql_bin" ]; then
              export HEINZEL_TEST_POSTGRES_BIN_DIR="$postgresql_bin"
            fi
          fi
          uv run pytest -m "live or emulator" -q -p no:randomly -rs \
          --junitxml="$RUNNER_TEMP/live-journeys.xml" \
          tests/integration/test_postgresql_checked_sum_evidence.py \
          tests/integration/test_postgresql_compiled_product_journey_live.py \
          tests/integration/test_postgresql_composed_acquisition_live.py \
          tests/integration/test_postgresql_acquisition_land_live.py \
          tests/integration/test_postgresql_leased_run_resume_live.py \
          tests/integration/test_postgresql_answer_query_live.py \
          tests/integration/test_postgresql_answer_generation_live.py \
          tests/integration/test_postgresql_product_materialization_live.py \
          tests/integration/test_postgresql_product_observation_live.py \
          tests/acceptance/test_console_answer_runtime.py \
          tests/integration/test_postgresql_query_estimator_live.py \
          tests/integration/test_postgresql_rejected_credentials_live.py \
          tests/integration/test_generation_scoped_product_sql_conformance.py \
          tests/integration/test_warehouse_access_provider_live.py \
          tests/integration/test_postgresql_warehouse_live.py \
          tests/integration/test_clickhouse_warehouse_live.py \
          providers/postgresql/tests/test_destination_live.py \
          providers/postgresql/tests/test_product_sql_observation_live.py \
          providers/postgresql/tests/test_rejected_credentials_live.py \
          providers/postgresql/tests/test_tls_rejected_credentials_live.py \
          providers/clickhouse/tests/test_destination_live.py \
          providers/clickhouse/tests/test_publication_conformance_live.py \
          services/dbt-adapter/tests/test_clickhouse_subprocess_live.py
      # A skipped journey is a gap, not a pass: a missing switch or tool must fail the run.
      - name: Require every selected journey to have run
        run: |
          python3 - "$RUNNER_TEMP/live-journeys.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ElementTree

          suite = ElementTree.parse(sys.argv[1]).getroot().find("testsuite")
          tests = int(suite.get("tests", "0"))
          skipped = int(suite.get("skipped", "0"))
          print(f"{tests} selected, {skipped} skipped")
          sys.exit(0 if tests > 0 and skipped == 0 else 1)
          EOF

name: Offline assurance

on:
  pull_request:
  # Pushes to a pull request branch already run through `pull_request`. Without this
  # filter every such push started a second, identical offline run.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an outdated pull request run, but let a main-branch run finish so its
  # evidence is not discarded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.13.5
          enable-cache: true
      - name: Sync locked workspace
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Type check test directories
        run: ./tests/type-check/check.sh
      - name: Run offline tests
        run: uv run pytest -m "not live"
      - name: Validate repository boundaries
        run: ./tests/repository-structure/test.sh
